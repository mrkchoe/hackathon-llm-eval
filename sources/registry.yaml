# Do not copy entire pages. Paraphrases only.

meta:
  accessed_date: "2026-10-03"
  pilot_label: "Independent pilot — not an official hackathon benchmark"

sources:
  - id: berkeley-ai-hackathon-2026-devpost
    event: UC Berkeley AI Hackathon 2026
    organizer: Hackathons @ Berkeley / Cal Hacks
    location: Berkeley, CA (Martin Luther King, Jr. Student Union)
    online: false
    dates: "2026-06-20 to 2026-06-21"
    challenge_or_submission: Event page (prizes & sponsor tracks)
    url: https://ai-hackathon-2026.devpost.com/
    date_accessed: "2026-10-03"
    evidence_kind: official_requirement
    paraphrase: >
      Collegiate AI hackathon with multiple sponsor prize tracks. Browserbase
      track: build any web agent using any model/framework, but it must be
      powered by Browserbase via browsers, search, fetch, Stagehand, or Browse CLI.
      Redis track: use Redis beyond caching (agent memory, vector search, context
      retrieval) among creativity/technical criteria. Claude/Anthropic and Redis
      Cloud credits appear as winner prizes on the page.
    required_sponsor_technology:
      browserbase_track: Browserbase platform (one of browsers/search/fetch/Stagehand/Browse CLI)
      redis_track: Meaningful Redis usage beyond caching for eligibility emphasis
    optional_or_preferred_technology: []
    available_participant_resources: unknown
    winner_prizes:
      - "Best Use of Browserbase: cash/merch+credits (winner awards)"
      - "Redis: Mac Minis / 25k Redis Cloud credits for the team / merch (winner awards)"
      - "Claude-related API credit prizes listed as winner awards"
    unknown_or_inaccessible:
      - Exact participant API credit budgets during the event (if any) not confirmed as unrestricted build budgets
      - Some prize TBA fields
    informed_evaluation_task:
      - web_research (Browserbase-adapted sandbox)
      - persistent_memory (Redis-inspired memory tools)

  - id: cal-hacks-12-devpost
    event: Cal Hacks 12.0
    organizer: Cal Hacks
    location: Palace of Fine Arts, San Francisco, CA
    online: false
    dates: "2025-10-24 to 2025-10-26"
    challenge_or_submission: Event page (prizes & sponsor tracks)
    url: https://cal-hacks-12-0.devpost.com/
    date_accessed: "2026-10-03"
    evidence_kind: official_requirement
    paraphrase: >
      Collegiate hackathon with sponsor challenges including Composio Toolrouter
      (integration depth across applications), Conversion (must incorporate
      workflows and a workflow builder; Temporal preferred/ideal), Letta
      (stateful persistent memory), Fetch AI Agentverse/chat protocol tracks,
      plus advertised DigitalOcean $200 signup offer and student Snowflake trial.
    required_sponsor_technology:
      composio_track: Composio Toolrouter integration across apps (judged on depth)
      conversion_track: Workflows + application workflow builder (Temporal preferred)
      letta_track: Letta Cloud or self-hosted Letta with meaningful persistent memory
    optional_or_preferred_technology:
      - Temporal for Conversion track
    available_participant_resources:
      - "DigitalOcean $200 signup offer — historical offer; current eligibility unverified"
      - "Student Snowflake 120-day trial — historical offer; current eligibility unverified"
    winner_prizes:
      - "Composio: $4K in Composio Credits (winner)"
      - "Conversion: Vespa Scooter or cash equivalent (winner)"
      - "Claude: Tungsten Cube + $5000 API Credits (winner)"
    unknown_or_inaccessible:
      - Whether historical cloud signup offers remain redeemable
      - Exact Composio credit grant terms for winners vs participants
    informed_evaluation_task:
      - cross_app_automation
      - durable_workflow
      - persistent_memory

