# Sponsor constraint registry for sponsor-stack mode.
# Live integrations start unimplemented. Mocks test model behavior only.

meta:
  accessed_date: "2026-10-03"
  note: >
    Historical event eligibility is separate from technical task success.
    Do not declare a project eligible for a past event.

constraints:
  - id: browserbase_web_agent
    event_source: berkeley-ai-hackathon-2026-devpost
    label: Browserbase-powered web agent
    requirement_summary: Web agent must use Browserbase via browsers/search/fetch/Stagehand/Browse CLI.
    required: true
    for_tracks: [best_use_of_browserbase]
    integration:
      status: unimplemented_live
      interface: hackeval.sponsor.browserbase.BrowserbaseClient
      mock_available: true
      mock_proves_usage: false
    credit_offers: []
    winner_prizes_not_budget:
      - cash_and_credits_as_listed_on_devpost
    verification_status: source_paraphrased

  - id: redis_beyond_caching
    event_source: berkeley-ai-hackathon-2026-devpost
    label: Redis beyond caching
    requirement_summary: Emphasize Redis for agent memory, vector search, context retrieval.
    required: false
    preferred: true
    for_tracks: [redis_creativity_technical]
    integration:
      status: unimplemented_live
      interface: hackeval.sponsor.redis_memory.RedisMemoryClient
      mock_available: true
      mock_proves_usage: false
